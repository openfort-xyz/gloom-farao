name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GLOOMBERB_REF: v0.17.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile

      # Gloomberb links its own copy at install time, so typecheck against a linked host.
      - name: Link the Gloomberb host
        run: |
          git clone --depth 1 --branch "$GLOOMBERB_REF" https://github.com/gloom-sh/gloomberb.git "$RUNNER_TEMP/gloomberb"
          bun install --cwd "$RUNNER_TEMP/gloomberb" --frozen-lockfile
          ln -sfn "$RUNNER_TEMP/gloomberb" node_modules/gloomberb
          ln -sfn "$RUNNER_TEMP/gloomberb/node_modules/react" node_modules/react

      - run: bun run typecheck
      - run: bun test
